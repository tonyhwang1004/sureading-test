<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 관리자 대시보드 - 수리딩어학원</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* 헤더 */
        .top-header {
            background: rgba(0,0,0,0.3);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #4CAF50;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .header-time {
            color: #888;
            font-size: 14px;
        }

        .refresh-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .refresh-btn:hover {
            background: #4CAF50;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 통계 카드 그리드 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            border-radius: 16px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .stat-card.highlight {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            border: none;
        }

        .stat-card.warning {
            background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
            border: none;
        }

        .stat-card.info {
            background: linear-gradient(135deg, #2196F3 0%, #1565C0 100%);
            border: none;
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }

        /* 탭 네비게이션 */
        .tab-nav {
            display: flex;
            gap: 5px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #888;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }

        .tab-btn.active {
            background: #4CAF50;
            color: #fff;
        }

        .tab-btn .badge {
            background: rgba(255,0,0,0.8);
            color: #fff;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
        }

        .tab-btn.active .badge {
            background: rgba(255,255,255,0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 툴바 */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 0 15px;
            flex: 1;
            max-width: 400px;
        }

        .search-box input {
            background: transparent;
            border: none;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            width: 100%;
            outline: none;
        }

        .search-box input::placeholder {
            color: #666;
        }

        .filter-btns {
            display: flex;
            gap: 10px;
        }

        .filter-btn {
            padding: 10px 16px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #4CAF50;
        }

        /* 테이블 */
        .table-container {
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        th {
            background: rgba(76, 175, 80, 0.3);
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4CAF50;
            position: sticky;
            top: 0;
        }

        tr {
            transition: background 0.2s;
        }

        tr:hover {
            background: rgba(255,255,255,0.05);
        }

        /* 버튼 */
        .btn {
            padding: 8px 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }

        .btn-approve {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: #fff;
        }

        .btn-approve:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        .btn-reject {
            background: linear-gradient(135deg, #f44336, #c62828);
            color: #fff;
        }

        .btn-reject:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.4);
        }

        .btn-info {
            background: linear-gradient(135deg, #2196F3, #1565C0);
            color: #fff;
        }

        .btn-info:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.4);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.2);
        }

        /* 상태 뱃지 */
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-approved {
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            border: 1px solid #4CAF50;
        }

        .status-pending {
            background: rgba(255, 152, 0, 0.2);
            color: #FF9800;
            border: 1px solid #FF9800;
        }

        .status-rejected {
            background: rgba(244, 67, 54, 0.2);
            color: #f44336;
            border: 1px solid #f44336;
        }

        /* 전화번호 링크 */
        .phone-link {
            color: #4CAF50;
            text-decoration: none;
            transition: color 0.2s;
        }

        .phone-link:hover {
            color: #81C784;
            text-decoration: underline;
        }

        /* 빈 상태 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-size: 18px;
            margin-bottom: 10px;
            color: #888;
        }

        .empty-state p {
            font-size: 14px;
        }

        /* 로딩 */
        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .loading-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top-color: #4CAF50;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 모달 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.1);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-header {
            padding: 20px 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 18px;
            color: #4CAF50;
        }

        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: #fff;
        }

        .modal-body {
            padding: 25px;
        }

        .detail-row {
            display: flex;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            width: 120px;
            color: #888;
            font-size: 13px;
        }

        .detail-value {
            flex: 1;
            color: #fff;
            font-size: 14px;
        }

        .modal-footer {
            padding: 20px 25px;
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* 퀵 액션 */
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .quick-action-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            color: #fff;
        }

        .quick-action-btn:hover {
            background: rgba(255,255,255,0.1);
            transform: translateY(-3px);
        }

        .quick-action-btn .icon {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .quick-action-btn .label {
            font-size: 13px;
            color: #888;
        }

        /* 푸터 */
        .footer {
            text-align: center;
            padding: 30px;
            color: #555;
            font-size: 13px;
            border-top: 1px solid rgba(255,255,255,0.05);
            margin-top: 40px;
        }

        .footer a {
            color: #4CAF50;
            text-decoration: none;
        }

        /* 토스트 알림 */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: #fff;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            display: none;
            z-index: 2000;
            animation: slideIn 0.3s ease;
        }

        .toast.success {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
        }

        .toast.error {
            background: linear-gradient(135deg, #f44336, #c62828);
        }

        .toast.show {
            display: block;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        /* 반응형 */
        @media (max-width: 768px) {
            .top-header {
                padding: 10px 15px;
                flex-direction: column;
                gap: 10px;
            }

            .container {
                padding: 15px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .stat-card {
                padding: 15px;
            }

            .stat-number {
                font-size: 28px;
            }

            th, td {
                padding: 10px 8px;
                font-size: 12px;
            }

            .btn {
                padding: 6px 10px;
                font-size: 11px;
            }

            .toolbar {
                flex-direction: column;
            }

            .search-box {
                max-width: 100%;
            }

            .modal {
                margin: 10px;
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>
    <!-- 상단 헤더 -->
    <header class="top-header">
        <div class="logo">📚 수리딩어학원 관리자</div>
        <div class="header-actions">
            <span class="header-time" id="currentTime"></span>
            <button class="refresh-btn" onclick="refreshAll()">🔄 새로고침</button>
        </div>
    </header>

    <div class="container">
        <!-- 통계 카드 -->
        <div class="stats-grid">
            <div class="stat-card warning">
                <div class="stat-icon">⏳</div>
                <div class="stat-number" id="pendingStat">0</div>
                <div class="stat-label">승인 대기</div>
            </div>
            <div class="stat-card highlight">
                <div class="stat-icon">✅</div>
                <div class="stat-number" id="approvedStat">0</div>
                <div class="stat-label">승인된 회원</div>
            </div>
            <div class="stat-card info">
                <div class="stat-icon">📝</div>
                <div class="stat-number" id="levelTestStat">0</div>
                <div class="stat-label">레벨테스트 대기</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-number" id="totalStat">0</div>
                <div class="stat-label">전체 회원</div>
            </div>
        </div>

        <!-- 퀵 액션 -->
        <div class="quick-actions">
            <div class="quick-action-btn" onclick="showTab('pending')">
                <div class="icon">⏳</div>
                <div class="label">승인 대기 처리</div>
            </div>
            <div class="quick-action-btn" onclick="showTab('leveltest')">
                <div class="icon">📝</div>
                <div class="label">레벨테스트 확인</div>
            </div>
            <div class="quick-action-btn" onclick="showTab('all')">
                <div class="icon">👥</div>
                <div class="label">회원 관리</div>
            </div>
            <div class="quick-action-btn" onclick="window.open('https://www.suelibrary.store', '_blank')">
                <div class="icon">🌐</div>
                <div class="label">메인 사이트</div>
            </div>
        </div>

        <!-- 탭 네비게이션 -->
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="pending">
                ⏳ 승인 대기 <span class="badge" id="pendingBadge">0</span>
            </button>
            <button class="tab-btn" data-tab="leveltest">
                📝 레벨테스트 <span class="badge" id="levelTestBadge">0</span>
            </button>
            <button class="tab-btn" data-tab="all">
                👥 전체 회원
            </button>
            <button class="tab-btn" data-tab="checked">
                ✅ 처리 완료
            </button>
        </div>

        <!-- 승인 대기 탭 -->
        <div id="pending" class="tab-content active">
            <div class="toolbar">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="pendingSearch" placeholder="이름, 학교, 연락처로 검색..." oninput="filterPending()">
                </div>
            </div>
            <div class="table-container">
                <div id="pendingList">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>데이터를 불러오는 중...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 레벨테스트 탭 -->
        <div id="leveltest" class="tab-content">
            <div class="toolbar">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="levelTestSearch" placeholder="이름, 학교, 연락처로 검색..." oninput="filterLevelTest()">
                </div>
            </div>
            <div class="table-container">
                <div id="levelTestList">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>데이터를 불러오는 중...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 전체 회원 탭 -->
        <div id="all" class="tab-content">
            <div class="toolbar">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="allSearch" placeholder="이름, 학교, 아이디로 검색..." oninput="filterAll()">
                </div>
                <div class="filter-btns">
                    <button class="filter-btn active" onclick="setMemberFilter('all', this)">전체</button>
                    <button class="filter-btn" onclick="setMemberFilter('approved', this)">승인됨</button>
                    <button class="filter-btn" onclick="setMemberFilter('pending', this)">대기중</button>
                    <button class="filter-btn" onclick="setMemberFilter('rejected', this)">거절됨</button>
                </div>
            </div>
            <div class="table-container">
                <div id="allList">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>데이터를 불러오는 중...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 처리 완료 탭 -->
        <div id="checked" class="tab-content">
            <div class="toolbar">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="checkedSearch" placeholder="이름, 학교로 검색..." oninput="filterChecked()">
                </div>
            </div>
            <div class="table-container">
                <div id="checkedList">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <p>데이터를 불러오는 중...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 푸터 -->
        <div class="footer">
            <p>수리딩어학원 관리자 시스템 v2.0</p>
            <p><a href="https://www.suelibrary.store">← 메인 사이트로 돌아가기</a></p>
        </div>
    </div>

    <!-- 상세 모달 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal">
            <div class="modal-header">
                <h3>📋 상세 정보</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalContent">
            </div>
            <div class="modal-footer" id="modalFooter">
            </div>
        </div>
    </div>

    <!-- 토스트 알림 -->
    <div class="toast" id="toast"></div>

    <script>
                const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwTeQD4jkzoSiYGeKs57MmkqlROFYz6KF_jdiGn0kGd2sE6x1yrPN056cOCn_8cZbsI/exec';

        
        // 전역 데이터 저장
        let allMembersData = [];
        let levelTestData = [];
        let currentMemberFilter = 'all';

        // 시간 업데이트
        function updateTime() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                weekday: 'long',
                hour: '2-digit', 
                minute: '2-digit' 
            };
            document.getElementById('currentTime').textContent = now.toLocaleDateString('ko-KR', options);
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 전화번호 포맷팅
        function formatPhone(phone) {
            if (!phone) return '-';
            let str = String(phone).replace(/\D/g, '');
            if (str.length === 9) str = '0' + str;
            if (str.length === 10 && !str.startsWith('0')) str = '0' + str;
            if (str.length === 11) {
                return str.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
            } else if (str.length === 10) {
                return str.replace(/(\d{3})(\d{3})(\d{4})/, '$1-$2-$3');
            }
            return phone;
        }

        // 날짜 포맷팅
        function formatDate(dateStr) {
            if (!dateStr) return '-';
            try {
                const date = new Date(dateStr);
                const month = date.getMonth() + 1;
                const day = date.getDate();
                const hour = String(date.getHours()).padStart(2, '0');
                const min = String(date.getMinutes()).padStart(2, '0');
                return `${month}/${day} ${hour}:${min}`;
            } catch {
                return dateStr;
            }
        }

        // 전화번호 링크
        function phoneLink(phone) {
            const formatted = formatPhone(phone);
            if (formatted === '-') return '-';
            const raw = String(phone).replace(/\D/g, '');
            return `<a href="tel:${raw}" class="phone-link">${formatted}</a>`;
        }

        // 토스트 알림
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast show ${type}`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // 모달
        function openModal(content, footer = '') {
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('modalFooter').innerHTML = footer;
            document.getElementById('detailModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
        }

        // 탭 전환
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => showTab(btn.dataset.tab));
        });

        function showTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
            document.getElementById(tabId).classList.add('active');
        }

        // 전체 새로고침
        function refreshAll() {
            loadPendingMembers();
            loadAllMembers();
            loadLevelTestApplications();
            showToast('🔄 데이터를 새로고침했습니다');
        }

        // 승인 대기 회원 로드
        async function loadPendingMembers() {
            const container = document.getElementById('pendingList');
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getPendingMembers`);
                const result = await response.json();

                const count = result.members?.length || 0;
                document.getElementById('pendingBadge').textContent = count;
                document.getElementById('pendingStat').textContent = count;

                if (count > 0) {
                    renderPendingTable(result.members);
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">✅</div>
                            <h3>승인 대기 회원이 없습니다</h3>
                            <p>모든 회원 가입 요청이 처리되었습니다</p>
                        </div>
                    `;
                }
            } catch (error) {
                container.innerHTML = '<div class="empty-state"><h3>데이터 로드 실패</h3></div>';
            }
        }

        function renderPendingTable(members, search = '') {
            const filtered = members.filter(m => 
                !search || 
                (m.name && m.name.includes(search)) ||
                (m.school && m.school.includes(search)) ||
                (m.parentPhone && String(m.parentPhone).includes(search))
            );

            if (filtered.length === 0) {
                document.getElementById('pendingList').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🔍</div>
                        <h3>검색 결과가 없습니다</h3>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>이름</th>
                            <th>학년</th>
                            <th>학교</th>
                            <th>부모님 연락처</th>
                            <th>가입일</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filtered.forEach(member => {
                html += `
                    <tr>
                        <td><strong>${member.name || '-'}</strong></td>
                        <td>${member.grade || '-'}</td>
                        <td>${member.school || '-'}</td>
                        <td>${phoneLink(member.parentPhone)}</td>
                        <td>${formatDate(member.created_at)}</td>
                        <td>
                            <button class="btn btn-approve" onclick="approveMember('${member.username}')">✅ 승인</button>
                            <button class="btn btn-reject" onclick="rejectMember('${member.username}')">❌ 거절</button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('pendingList').innerHTML = html;
            window.pendingData = members;
        }

        function filterPending() {
            const search = document.getElementById('pendingSearch').value;
            if (window.pendingData) renderPendingTable(window.pendingData, search);
        }

        // 전체 회원 로드
        async function loadAllMembers() {
            const container = document.getElementById('allList');
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getAllMembers`);
                const result = await response.json();

                allMembersData = result.members || [];
                const approved = allMembersData.filter(m => m.status === 'approved').length;
                
                document.getElementById('totalStat').textContent = allMembersData.length;
                document.getElementById('approvedStat').textContent = approved;

                renderAllTable();
            } catch (error) {
                container.innerHTML = '<div class="empty-state"><h3>데이터 로드 실패</h3></div>';
            }
        }

        function renderAllTable() {
            const search = document.getElementById('allSearch').value.toLowerCase();
            let filtered = allMembersData;

            if (currentMemberFilter !== 'all') {
                filtered = filtered.filter(m => m.status === currentMemberFilter);
            }

            if (search) {
                filtered = filtered.filter(m =>
                    (m.name && m.name.toLowerCase().includes(search)) ||
                    (m.school && m.school.toLowerCase().includes(search)) ||
                    (m.username && m.username.toLowerCase().includes(search))
                );
            }

            if (filtered.length === 0) {
                document.getElementById('allList').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">👥</div>
                        <h3>회원이 없습니다</h3>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>아이디</th>
                            <th>이름</th>
                            <th>학년</th>
                            <th>학교</th>
                            <th>연락처</th>
                            <th>레벨</th>
                            <th>상태</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filtered.forEach(member => {
                const statusClass = member.status === 'approved' ? 'status-approved' : 
                                  member.status === 'pending' ? 'status-pending' : 'status-rejected';
                const statusText = member.status === 'approved' ? '승인됨' : 
                                  member.status === 'pending' ? '대기중' : '거절됨';

                html += `
                    <tr>
                        <td>${member.username}</td>
                        <td><strong>${member.name || '-'}</strong></td>
                        <td>${member.grade || '-'}</td>
                        <td>${member.school || '-'}</td>
                        <td>${phoneLink(member.parentPhone)}</td>
                        <td>Lv.${member.level || 1}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>
                            ${member.status !== 'approved' ? 
                                `<button class="btn btn-approve" onclick="approveMember('${member.username}')">✅</button>` : 
                                `<button class="btn btn-reject" onclick="rejectMember('${member.username}')">🚫</button>`
                            }
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('allList').innerHTML = html;
        }

        function filterAll() {
            renderAllTable();
        }

        function setMemberFilter(filter, btn) {
            currentMemberFilter = filter;
            document.querySelectorAll('#all .filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderAllTable();
        }

        // 레벨테스트 신청 로드
        async function loadLevelTestApplications() {
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=getLevelTestApplications`);
                const result = await response.json();

                levelTestData = result.applications || [];
                const unchecked = levelTestData.filter(a => a.status !== 'checked');
                const checked = levelTestData.filter(a => a.status === 'checked');

                document.getElementById('levelTestBadge').textContent = unchecked.length;
                document.getElementById('levelTestStat').textContent = unchecked.length;

                renderLevelTestTable(unchecked);
                renderCheckedTable(checked);
            } catch (error) {
                document.getElementById('levelTestList').innerHTML = '<div class="empty-state"><h3>데이터 로드 실패</h3></div>';
            }
        }

        function renderLevelTestTable(apps, search = '') {
            const filtered = apps.filter(a =>
                !search ||
                (a.studentName && a.studentName.includes(search)) ||
                (a.school && a.school.includes(search)) ||
                (a.parentPhone && String(a.parentPhone).includes(search))
            );

            if (filtered.length === 0) {
                document.getElementById('levelTestList').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📝</div>
                        <h3>대기 중인 레벨테스트 신청이 없습니다</h3>
                        <p>모든 신청이 처리되었습니다</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>신청일</th>
                            <th>이름</th>
                            <th>학년</th>
                            <th>학교</th>
                            <th>부모님 연락처</th>
                            <th>희망일시</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filtered.forEach((app, index) => {
                html += `
                    <tr>
                        <td>${formatDate(app.timestamp)}</td>
                        <td><strong>${app.studentName || '-'}</strong></td>
                        <td>${app.grade || '-'}</td>
                        <td>${app.school || '-'}</td>
                        <td>${phoneLink(app.parentPhone)}</td>
                        <td>${app.preferredDateTime || '-'}</td>
                        <td>
                            <button class="btn btn-info" onclick="viewLevelTest(${index}, false)">📋 상세</button>
                            <button class="btn btn-approve" onclick="markAsChecked(${app.row})">✅ 확인</button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('levelTestList').innerHTML = html;
            window.uncheckedData = filtered;
        }

        function filterLevelTest() {
            const search = document.getElementById('levelTestSearch').value;
            const unchecked = levelTestData.filter(a => a.status !== 'checked');
            renderLevelTestTable(unchecked, search);
        }

        // 처리 완료 목록
        function renderCheckedTable(apps, search = '') {
            const filtered = apps.filter(a =>
                !search ||
                (a.studentName && a.studentName.includes(search)) ||
                (a.school && a.school.includes(search))
            );

            if (filtered.length === 0) {
                document.getElementById('checkedList').innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📂</div>
                        <h3>처리 완료된 신청이 없습니다</h3>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>신청일</th>
                            <th>이름</th>
                            <th>학년</th>
                            <th>학교</th>
                            <th>부모님 연락처</th>
                            <th>영어수준</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            filtered.forEach((app, index) => {
                html += `
                    <tr>
                        <td>${formatDate(app.timestamp)}</td>
                        <td><strong>${app.studentName || '-'}</strong></td>
                        <td>${app.grade || '-'}</td>
                        <td>${app.school || '-'}</td>
                        <td>${phoneLink(app.parentPhone)}</td>
                        <td>${app.englishLevel || '-'}</td>
                        <td>
                            <button class="btn btn-info" onclick="viewLevelTest(${index}, true)">📋 상세</button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            document.getElementById('checkedList').innerHTML = html;
            window.checkedData = filtered;
        }

        function filterChecked() {
            const search = document.getElementById('checkedSearch').value;
            const checked = levelTestData.filter(a => a.status === 'checked');
            renderCheckedTable(checked, search);
        }

        // 레벨테스트 상세 보기
        function viewLevelTest(index, isChecked) {
            const app = isChecked ? window.checkedData[index] : window.uncheckedData[index];
            if (!app) return;

            const content = `
                <div class="detail-row">
                    <div class="detail-label">👤 학생이름</div>
                    <div class="detail-value"><strong>${app.studentName || '-'}</strong></div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">⚧ 성별</div>
                    <div class="detail-value">${app.gender || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">🏫 학교</div>
                    <div class="detail-value">${app.school || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">📚 학년</div>
                    <div class="detail-value">${app.grade || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">📱 학생 연락처</div>
                    <div class="detail-value">${phoneLink(app.studentPhone)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">📞 부모님 연락처</div>
                    <div class="detail-value">${phoneLink(app.parentPhone)}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">📅 희망 상담일시</div>
                    <div class="detail-value">${app.preferredDateTime || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">📊 영어 수준</div>
                    <div class="detail-value">${app.englishLevel || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">🎯 관심 프로그램</div>
                    <div class="detail-value">${app.programs || '-'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">💬 문의사항</div>
                    <div class="detail-value">${app.inquiry || '없음'}</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">🕐 신청일시</div>
                    <div class="detail-value">${formatDate(app.timestamp)}</div>
                </div>
            `;

            const footer = isChecked ? 
                `<button class="btn btn-secondary" onclick="closeModal()">닫기</button>` :
                `<button class="btn btn-secondary" onclick="closeModal()">닫기</button>
                 <button class="btn btn-approve" onclick="markAsChecked(${app.row}); closeModal();">✅ 확인 완료</button>`;

            openModal(content, footer);
        }

        // 확인 완료 처리
        async function markAsChecked(row) {
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=markLevelTestChecked&row=${row}`);
                const result = await response.json();

                if (result.success) {
                    showToast('✅ 확인 완료 처리되었습니다');
                    loadLevelTestApplications();
                } else {
                    showToast('처리 실패: ' + result.message, 'error');
                }
            } catch (error) {
                showToast('서버 오류가 발생했습니다', 'error');
            }
        }

        // 회원 승인
        async function approveMember(username) {
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=approveMember&username=${encodeURIComponent(username)}`);
                const result = await response.json();

                if (result.success) {
                    showToast('✅ 회원이 승인되었습니다');
                    loadPendingMembers();
                    loadAllMembers();
                } else {
                    showToast('승인 실패: ' + result.message, 'error');
                }
            } catch (error) {
                showToast('서버 오류가 발생했습니다', 'error');
            }
        }

        // 회원 거절
        async function rejectMember(username) {
            if (!confirm(`정말 ${username} 회원을 거절/정지하시겠습니까?`)) return;

            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=rejectMember&username=${encodeURIComponent(username)}`);
                const result = await response.json();

                if (result.success) {
                    showToast('🚫 회원이 거절/정지되었습니다');
                    loadPendingMembers();
                    loadAllMembers();
                } else {
                    showToast('처리 실패: ' + result.message, 'error');
                }
            } catch (error) {
                showToast('서버 오류가 발생했습니다', 'error');
            }
        }

        // 초기 로드
        loadPendingMembers();
        loadAllMembers();
        loadLevelTestApplications();

        // 모달 외부 클릭시 닫기
        document.getElementById('detailModal').addEventListener('click', (e) => {
            if (e.target.id === 'detailModal') closeModal();
        });
    </script>
</body>
</html>
