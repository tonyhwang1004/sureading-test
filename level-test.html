<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수리딩 레벨 테스트</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f5f4f0; --surface:#fff; --surface2:#f0eeea; --border:rgba(0,0,0,0.08);
  --text:#1a1a2e; --muted:#7a7a8a; --accent:#5b4fcf; --accent2:#1a9e78;
  --gold:#d4900a; --danger:#d94040; --shadow:0 4px 24px rgba(0,0,0,0.07);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.header{position:fixed;top:0;left:0;right:0;padding:16px 40px;display:flex;justify-content:space-between;align-items:center;background:rgba(245,244,240,0.95);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);z-index:100;}
.logo{font-size:1.1rem;font-weight:700;color:var(--accent);text-decoration:none;}
.timer-box{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:6px 16px;font-size:0.9rem;font-weight:600;}
.timer-box.warning{border-color:var(--danger);color:var(--danger);}
.back-btn{padding:7px 18px;border:1.5px solid var(--border);border-radius:20px;background:transparent;color:var(--muted);cursor:pointer;font-size:0.82rem;text-decoration:none;font-family:'DM Sans',sans-serif;}
.back-btn:hover{border-color:var(--accent);color:var(--accent);}
.container{max-width:860px;margin:0 auto;padding:90px 20px 60px;}

/* 시작 화면 */
#startScreen{text-align:center;padding:40px 0;}
.start-badge{display:inline-block;padding:5px 16px;background:rgba(91,79,207,0.1);border:1.5px solid rgba(91,79,207,0.2);border-radius:20px;font-size:0.75rem;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:20px;font-weight:500;}
.start-title{font-size:2.8rem;font-weight:800;line-height:1.2;margin-bottom:14px;color:var(--text);}
.start-title span{color:var(--accent);}
.start-desc{font-size:0.95rem;color:var(--muted);line-height:1.8;margin-bottom:36px;}
.section-overview{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:36px;}
.sec-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:18px 10px;text-align:center;box-shadow:var(--shadow);}
.sec-card .sec-icon{font-size:1.4rem;margin-bottom:6px;}
.sec-card .sec-num{font-size:1.6rem;font-weight:800;color:var(--accent);margin-bottom:2px;}
.sec-card .sec-name{font-size:0.72rem;color:var(--muted);font-weight:500;}
.start-btn{padding:16px 50px;background:var(--accent);border:none;border-radius:50px;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:all 0.3s;font-family:'DM Sans',sans-serif;box-shadow:0 8px 24px rgba(91,79,207,0.3);}
.start-btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(91,79,207,0.4);}

/* 섹션 헤더 */
.section-header{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:20px 28px;margin-bottom:24px;box-shadow:var(--shadow);display:flex;align-items:center;gap:16px;}
.sec-badge{padding:6px 16px;border-radius:20px;font-size:0.78rem;font-weight:600;letter-spacing:0.5px;}
.sb-vocab{background:rgba(91,79,207,0.1);color:var(--accent);border:1.5px solid rgba(91,79,207,0.2);}
.sb-grammar{background:rgba(212,144,10,0.1);color:var(--gold);border:1.5px solid rgba(212,144,10,0.2);}
.sb-reading{background:rgba(26,158,120,0.1);color:var(--accent2);border:1.5px solid rgba(26,158,120,0.2);}
.sb-arrange{background:rgba(217,64,64,0.1);color:var(--danger);border:1.5px solid rgba(217,64,64,0.2);}
.sec-header-info h2{font-size:1.1rem;font-weight:700;color:var(--text);margin-bottom:2px;}
.sec-header-info p{font-size:0.82rem;color:var(--muted);}

/* 진행 바 */
.progress-bar-wrap{margin-bottom:24px;}
.progress-top{display:flex;justify-content:space-between;font-size:0.82rem;color:var(--muted);margin-bottom:8px;}
.prog-bg{height:6px;background:rgba(0,0,0,0.08);border-radius:6px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),#8b7fef);border-radius:6px;transition:width 0.4s;}

/* 문제 카드 */
.q-card{background:var(--surface);border:1.5px solid var(--border);border-radius:18px;padding:28px 32px;margin-bottom:16px;box-shadow:var(--shadow);}
.q-num{font-size:0.78rem;font-weight:600;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px;}
.q-text{font-size:1rem;line-height:1.7;color:var(--text);margin-bottom:20px;}
.q-text strong{color:var(--accent);}

/* 보기 */
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt-btn{padding:12px 16px;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:0.9rem;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.18s;text-align:left;display:flex;align-items:center;gap:10px;line-height:1.4;}
.opt-label{width:26px;height:26px;border-radius:50%;background:#fff;border:1.5px solid rgba(0,0,0,0.1);display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;flex-shrink:0;color:var(--muted);transition:all 0.18s;}
.opt-btn:hover:not(.selected):not(.disabled){border-color:var(--accent);background:rgba(91,79,207,0.05);}
.opt-btn:hover:not(.selected):not(.disabled) .opt-label{background:var(--accent);border-color:var(--accent);color:#fff;}
.opt-btn.selected{border-color:var(--accent);background:rgba(91,79,207,0.08);}
.opt-btn.selected .opt-label{background:var(--accent);border-color:var(--accent);color:#fff;}
.opt-btn.correct{border-color:var(--accent2);background:rgba(26,158,120,0.08);}
.opt-btn.correct .opt-label{background:var(--accent2);border-color:var(--accent2);color:#fff;}
.opt-btn.wrong{border-color:var(--danger);background:rgba(217,64,64,0.08);}
.opt-btn.wrong .opt-label{background:var(--danger);border-color:var(--danger);color:#fff;}
.opt-btn.disabled{cursor:default;}

/* 독해 지문 */
.passage-box{background:#f7f6ff;border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:20px 24px;margin-bottom:20px;font-size:0.92rem;line-height:1.9;color:#3a3a5a;}
.passage-label{font-size:0.72rem;font-weight:600;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px;}
.passage-long{background:#f7f6ff;border:1.5px solid rgba(91,79,207,0.15);border-radius:12px;padding:24px;margin-bottom:24px;font-size:0.92rem;line-height:1.9;color:#3a3a5a;}
.passage-long-label{font-size:0.72rem;font-weight:600;color:var(--accent);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;}

/* 단어 배열 */
.korean-sentence{background:rgba(217,64,64,0.06);border:1.5px solid rgba(217,64,64,0.15);border-radius:10px;padding:12px 18px;margin-bottom:16px;font-size:1rem;font-weight:600;color:#5a1a1a;text-align:center;}
.word-bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;min-height:44px;padding:10px;background:var(--surface2);border:1.5px dashed var(--border);border-radius:10px;}
.answer-area{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:10px;background:#fff;border:1.5px solid var(--border);border-radius:10px;margin-bottom:8px;transition:border-color 0.2s;}
.answer-area.active{border-color:var(--accent);}
.word-chip{padding:7px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:20px;font-size:0.88rem;font-weight:500;cursor:pointer;transition:all 0.18s;user-select:none;color:var(--text);}
.word-chip:hover{border-color:var(--accent);background:rgba(91,79,207,0.05);color:var(--accent);}
.word-chip.in-answer{background:rgba(91,79,207,0.1);border-color:var(--accent);color:var(--accent);}
.word-chip.correct-chip{background:rgba(26,158,120,0.1);border-color:var(--accent2);color:var(--accent2);}
.word-chip.wrong-chip{background:rgba(217,64,64,0.1);border-color:var(--danger);color:var(--danger);}
.arrange-hint{font-size:0.8rem;color:var(--muted);margin-bottom:4px;}
.correct-answer{font-size:0.82rem;color:var(--accent2);margin-top:6px;display:none;}

/* 네비게이션 버튼 */
.nav-btns{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:20px;border-top:1px solid var(--border);}
.btn-prev{padding:12px 28px;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;color:var(--muted);font-size:0.92rem;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;transition:all 0.2s;}
.btn-prev:hover{border-color:var(--accent);color:var(--accent);}
.btn-next{padding:12px 32px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:0.92rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;box-shadow:0 4px 14px rgba(91,79,207,0.25);}
.btn-next:hover{background:#4a3ec0;transform:translateY(-1px);}
.btn-submit{padding:12px 32px;background:var(--accent2);border:none;border-radius:12px;color:#fff;font-size:0.92rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s;box-shadow:0 4px 14px rgba(26,158,120,0.25);}
.btn-submit:hover{background:#158060;}
.q-counter{font-size:0.85rem;color:var(--muted);font-weight:500;}

/* 결과 화면 */
#resultScreen{display:none;}
.result-hero{background:var(--surface);border:1.5px solid var(--border);border-radius:24px;padding:40px;text-align:center;box-shadow:var(--shadow);margin-bottom:20px;}
.result-emoji{font-size:3rem;margin-bottom:14px;}
.result-level-tag{font-size:0.82rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;margin-bottom:6px;font-weight:500;}
.result-level{font-size:2.6rem;font-weight:800;margin-bottom:4px;}
.result-name{font-size:1rem;color:var(--muted);margin-bottom:28px;}
.score-row{display:flex;background:var(--surface2);border-radius:14px;overflow:hidden;margin-bottom:24px;}
.score-cell{flex:1;padding:18px 8px;text-align:center;border-right:1px solid var(--border);}
.score-cell:last-child{border-right:none;}
.score-val{font-size:1.8rem;font-weight:800;color:var(--text);margin-bottom:3px;}
.score-lbl{font-size:0.72rem;color:var(--muted);}
.section-scores{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px;}
.sec-score-card{background:var(--surface2);border-radius:12px;padding:14px 16px;}
.sec-score-name{font-size:0.78rem;color:var(--muted);margin-bottom:8px;font-weight:500;}
.sec-score-bar-bg{height:5px;background:rgba(0,0,0,0.08);border-radius:4px;margin-bottom:6px;}
.sec-score-bar{height:100%;border-radius:4px;transition:width 0.8s ease;}
.sec-score-val{font-size:0.82rem;font-weight:600;}
.rec-books{background:#f7f6ff;border:1.5px solid rgba(91,79,207,0.15);border-radius:14px;padding:18px 20px;margin-bottom:24px;text-align:left;}
.rec-title{font-size:0.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;font-weight:600;}
.book-chips{display:flex;flex-wrap:wrap;gap:8px;}
.book-chip{padding:5px 12px;background:rgba(91,79,207,0.1);border:1px solid rgba(91,79,207,0.2);border-radius:20px;font-size:0.78rem;color:var(--accent);font-weight:500;}
.result-actions{display:flex;gap:12px;}
.btn-retry{flex:1;padding:13px;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-size:0.9rem;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;}
.btn-retry:hover{border-color:var(--accent);color:var(--accent);}
.btn-home{flex:1;padding:13px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-size:0.9rem;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;}
.btn-home:hover{background:#4a3ec0;}

@media(max-width:600px){
  .start-title{font-size:2rem;} .section-overview{grid-template-columns:repeat(3,1fr);} .options{grid-template-columns:1fr;} .q-card{padding:20px;} .section-scores{grid-template-columns:1fr;} .header{padding:12px 16px;} .container{padding:80px 14px 40px;}
}
</style>
</head>
<body>
<header class="header">
  <a href="index.html" class="back-btn">← 메인</a>
  <div class="logo">📚 수리딩어학원 레벨 테스트</div>
  <div class="timer-box" id="timerBox">⏱ <span id="timerDisplay">60:00</span></div>
</header>

<div class="container">
  <!-- 시작 화면 -->
  <div id="startScreen">
    <div class="start-badge">SUREADING Level Assessment</div>
    <h1 class="start-title">영어 <span>레벨</span> 테스트</h1>
    <p class="start-desc">토플 · 토익 스타일의 종합 영어 평가 테스트입니다.<br>어휘 · 문법 · 독해 · 문장 배열 4개 섹션, 총 51문제 · 제한 시간 60분</p>
    <div class="section-overview">
      <div class="sec-card"><div class="sec-icon">📗</div><div class="sec-num">20</div><div class="sec-name">어휘</div></div>
      <div class="sec-card"><div class="sec-icon">✏️</div><div class="sec-num">20</div><div class="sec-name">문법</div></div>
      <div class="sec-card"><div class="sec-icon">📖</div><div class="sec-num">8</div><div class="sec-name">짧은 독해</div></div>
      <div class="sec-card"><div class="sec-icon">📄</div><div class="sec-num">6</div><div class="sec-name">긴 독해</div></div>
      <div class="sec-card"><div class="sec-icon">🔤</div><div class="sec-num">5</div><div class="sec-name">문장 배열</div></div>
    </div>
    <button class="start-btn" onclick="startTest()">테스트 시작 →</button>
  </div>

  <!-- 테스트 화면 -->
  <div id="testScreen" style="display:none;">
    <div class="progress-bar-wrap">
      <div class="progress-top">
        <span id="sectionLabel">Section 1 — Vocabulary</span>
        <span id="qProgress">1 / 51</span>
      </div>
      <div class="prog-bg"><div class="prog-fill" id="progFill" style="width:2%"></div></div>
    </div>
    <div id="questionArea"></div>
    <div class="nav-btns">
      <button class="btn-prev" id="btnPrev" onclick="goQuestion(-1)">← 이전</button>
      <span class="q-counter" id="qCounter">1 / 51</span>
      <button class="btn-next" id="btnNext" onclick="goQuestion(1)">다음 →</button>
    </div>
  </div>

  <!-- 결과 화면 -->
  <div id="resultScreen">
    <div class="result-hero">
      <div class="result-emoji" id="rEmoji">🎉</div>
      <div class="result-level-tag">나의 레벨</div>
      <div class="result-level" id="rLevel">Level 3</div>
      <div class="result-name" id="rName">Intermediate</div>
      <div class="score-row">
        <div class="score-cell"><div class="score-val" id="rTotal">0</div><div class="score-lbl">총점</div></div>
        <div class="score-cell"><div class="score-val" id="rCorrect">0/51</div><div class="score-lbl">정답</div></div>
        <div class="score-cell"><div class="score-val" id="rAccuracy">0%</div><div class="score-lbl">정확도</div></div>
        <div class="score-cell"><div class="score-val" id="rTime">-</div><div class="score-lbl">소요시간</div></div>
      </div>
      <div class="section-scores" id="sectionScores"></div>
      <div class="rec-books" id="recBooks"></div>
      <div class="result-actions">
        <button class="btn-retry" onclick="location.reload()">🔄 다시 풀기</button>
        <button class="btn-home" onclick="location.href='index.html'">메인으로 →</button>
      </div>
    </div>
  </div>
</div>

<script>
// =====================================================
// 문제 데이터
// =====================================================
const sections = [
  {
    id:'vocab', name:'Vocabulary', label:'Section 1 — Vocabulary',
    badge:'sb-vocab', icon:'📗', desc:'20문제 · 밑줄 친 단어의 의미를 고르세요',
    questions:[
      {q:'The scientist made an <strong>astounding</strong> discovery.',opts:['ordinary','remarkable','minor','expected'],ans:1,exp:'<strong>Astounding</strong> = 놀라운, 경이로운'},
      {q:'The new policy will <strong>alleviate</strong> poverty in the region.',opts:['worsen','ignore','reduce','measure'],ans:2,exp:'<strong>Alleviate</strong> = 완화하다, 경감하다'},
      {q:'Her speech was so <strong>eloquent</strong> that everyone was moved.',opts:['confusing','boring','well-spoken','aggressive'],ans:2,exp:'<strong>Eloquent</strong> = 유창한, 설득력 있는'},
      {q:'The company\'s reputation is <strong>impeccable</strong>.',opts:['questionable','flawless','improving','unknown'],ans:1,exp:'<strong>Impeccable</strong> = 흠잡을 데 없는, 완벽한'},
      {q:'He was <strong>reluctant</strong> to share his personal information.',opts:['eager','willing','unwilling','happy'],ans:2,exp:'<strong>Reluctant</strong> = 꺼리는, 마지못해 하는'},
      {q:'The treaty was <strong>ratified</strong> by all member nations.',opts:['rejected','formally approved','ignored','debated'],ans:1,exp:'<strong>Ratify</strong> = 비준하다, 공식 승인하다'},
      {q:'Her <strong>tenacious</strong> personality helped her overcome all obstacles.',opts:['weak','persistent','gentle','careless'],ans:1,exp:'<strong>Tenacious</strong> = 끈질긴, 집요한'},
      {q:'The politician\'s remarks were <strong>ambiguous</strong> and left many confused.',opts:['clear','inspiring','unclear','strong'],ans:2,exp:'<strong>Ambiguous</strong> = 모호한, 두 가지 이상으로 해석될 수 있는'},
      {q:'The manager made a <strong>pragmatic</strong> decision rather than an idealistic one.',opts:['emotional','theoretical','practical','irrational'],ans:2,exp:'<strong>Pragmatic</strong> = 실용적인, 현실적인'},
      {q:'Critics were <strong>cynical</strong> about the government\'s promises.',opts:['optimistic','hopeful','doubtful','supportive'],ans:2,exp:'<strong>Cynical</strong> = 냉소적인, 의심하는'},
      {q:'The new evidence will <strong>corroborate</strong> the witness\'s testimony.',opts:['contradict','confirm','ignore','replace'],ans:1,exp:'<strong>Corroborate</strong> = 확증하다, 뒷받침하다'},
      {q:'The island\'s ecosystem is extremely <strong>fragile</strong>.',opts:['strong','robust','easily damaged','stable'],ans:2,exp:'<strong>Fragile</strong> = 깨지기 쉬운, 취약한'},
      {q:'His <strong>profound</strong> knowledge of history impressed everyone.',opts:['shallow','deep','basic','partial'],ans:1,exp:'<strong>Profound</strong> = 깊은, 심오한'},
      {q:'The company decided to <strong>diversify</strong> its product range.',opts:['reduce','limit','expand variety','simplify'],ans:2,exp:'<strong>Diversify</strong> = 다양화하다'},
      {q:'The rescue team showed great <strong>valor</strong> during the operation.',opts:['fear','laziness','bravery','confusion'],ans:2,exp:'<strong>Valor</strong> = 용맹, 용기'},
      {q:'The <strong>ubiquitous</strong> smartphone has changed modern life.',opts:['rare','everywhere','expensive','new'],ans:1,exp:'<strong>Ubiquitous</strong> = 어디에나 있는, 편재하는'},
      {q:'Scientists need to <strong>mitigate</strong> the effects of climate change.',opts:['ignore','worsen','lessen','study'],ans:2,exp:'<strong>Mitigate</strong> = 완화하다, 경감하다'},
      {q:'The results of the study were <strong>inconclusive</strong>.',opts:['clear','definite','not decisive','accurate'],ans:2,exp:'<strong>Inconclusive</strong> = 결정적이지 않은, 불확실한'},
      {q:'She showed great <strong>resilience</strong> after losing her job.',opts:['weakness','depression','ability to recover','anger'],ans:2,exp:'<strong>Resilience</strong> = 회복력, 탄력성'},
      {q:'The government needs to <strong>scrutinize</strong> the new proposals carefully.',opts:['ignore','approve','examine closely','dismiss'],ans:2,exp:'<strong>Scrutinize</strong> = 면밀히 조사하다, 정밀 검토하다'},
    ]
  },
  {
    id:'grammar', name:'Grammar', label:'Section 2 — Grammar',
    badge:'sb-grammar', icon:'✏️', desc:'20문제 · 문법적으로 올바른 것을 고르세요',
    questions:[
      {q:'Choose the correct sentence:',opts:["She don't like vegetables.","She doesn't like vegetables.","She not like vegetables.","She doesn't likes vegetables."],ans:1,exp:'3인칭 단수 부정: <strong>doesn\'t + 동사원형</strong>'},

// =====================================================
// 상태 관리
// =====================================================
let allQuestions = [];
let currentIdx = 0;
let userAnswers = {};
let arrangeAnswers = {};
let timerInterval;
let timeLeft = 3600;
let startTime;

function buildAllQuestions() {
  allQuestions = [];
  sections.forEach(sec => {
    if (sec.questions) {
      sec.questions.forEach((q, i) => {
        allQuestions.push({ secId: sec.id, secName: sec.name, secLabel: sec.label, secBadge: sec.badge, type: 'mcq', ...q, globalIdx: allQuestions.length });
      });
    }
    if (sec.passages) {
      sec.passages.forEach((p, pi) => {
        p.questions.forEach((q, qi) => {
          allQuestions.push({ secId: sec.id, secName: sec.name, secLabel: sec.label, secBadge: sec.badge, type: 'passage', passage: p, ...q, globalIdx: allQuestions.length });
        });
      });
    }
  });
  // 문장 배열 추가
  const arr = sections.find(s => s.id === 'arrange');
  arr.questions.forEach((q, i) => {
    allQuestions.push({ secId: 'arrange', secName: '문장 배열', secLabel: arr.label, secBadge: arr.badge, type: 'arrange', ...q, globalIdx: allQuestions.length });
  });
}

function startTest() {
  buildAllQuestions();
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('testScreen').style.display = 'block';
  startTime = Date.now();
  startTimer();
  renderQuestion(0);
}

// =====================================================
// 타이머
// =====================================================
function startTimer() {
  timerInterval = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
    const s = (timeLeft % 60).toString().padStart(2, '0');
    document.getElementById('timerDisplay').textContent = `${m}:${s}`;
    if (timeLeft <= 300) document.getElementById('timerBox').classList.add('warning');
    if (timeLeft <= 0) { clearInterval(timerInterval); submitTest(); }
  }, 1000);
}

// =====================================================
// 문제 렌더링
// =====================================================
function renderQuestion(idx) {
  currentIdx = idx;
  const total = allQuestions.length;
  const q = allQuestions[idx];

  document.getElementById('sectionLabel').textContent = q.secLabel;
  document.getElementById('qProgress').textContent = `${idx + 1} / ${total}`;
  document.getElementById('qCounter').textContent = `${idx + 1} / ${total}`;
  document.getElementById('progFill').style.width = ((idx / total) * 100 + 1) + '%';

  document.getElementById('btnPrev').style.opacity = idx === 0 ? '0.3' : '1';
  document.getElementById('btnPrev').style.pointerEvents = idx === 0 ? 'none' : 'auto';

  const isLast = idx === total - 1;
  const btnNext = document.getElementById('btnNext');
  if (isLast) {
    btnNext.outerHTML = '<button class="btn-submit" id="btnNext" onclick="submitTest()">제출하기 ✓</button>';
  } else {
    const btn = document.getElementById('btnNext');
    if (btn.classList.contains('btn-submit')) {
      btn.outerHTML = '<button class="btn-next" id="btnNext" onclick="goQuestion(1)">다음 →</button>';
    }
  }

  const area = document.getElementById('questionArea');

  // 섹션 헤더 (섹션이 바뀔 때만)
  const prevQ = idx > 0 ? allQuestions[idx - 1] : null;
  const showHeader = !prevQ || prevQ.secId !== q.secId;

  let html = '';
  if (showHeader) {
    const sec = sections.find(s => s.id === q.secId) || { icon: '🔤', name: q.secName, desc: '' };
    html += `<div class="section-header">
      <span class="sec-badge ${q.secBadge}">${sec.icon} ${q.secName}</span>
      <div class="sec-header-info"><h2>${q.secLabel}</h2><p>${sec.desc || ''}</p></div>
    </div>`;
  }

  if (q.type === 'arrange') {
    html += renderArrange(q, idx);
  } else if (q.type === 'passage') {
    html += renderPassage(q, idx);
  } else {
    html += renderMCQ(q, idx);
  }

  area.innerHTML = html;

  // 배열 문제 이벤트
  if (q.type === 'arrange') initArrange(idx, q);
}

function renderMCQ(q, idx) {
  const saved = userAnswers[idx];
  const labels = ['A', 'B', 'C', 'D'];
  const opts = q.opts.map((o, i) => {
    let cls = 'opt-btn';
    if (saved === i) cls += ' selected';
    return `<button class="${cls}" onclick="selectMCQ(${idx},${i})" id="opt_${idx}_${i}">
      <span class="opt-label">${labels[i]}</span><span>${o}</span>
    </button>`;
  }).join('');
  return `<div class="q-card">
    <div class="q-num">Q${idx + 1}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">${opts}</div>
  </div>`;
}

function renderPassage(q, idx) {
  const saved = userAnswers[idx];
  const labels = ['A', 'B', 'C', 'D'];
  const isLong = q.secId === 'reading_long';
  const passageHtml = isLong
    ? `<div class="passage-long"><div class="passage-long-label">📄 ${q.passage.title}</div>${q.passage.text.replace(/\n/g, '<br><br>')}</div>`
    : `<div class="passage-box"><div class="passage-label">📖 ${q.passage.title}</div>${q.passage.text}</div>`;
  const opts = q.opts.map((o, i) => {
    let cls = 'opt-btn';
    if (saved === i) cls += ' selected';
    return `<button class="${cls}" onclick="selectMCQ(${idx},${i})" id="opt_${idx}_${i}">
      <span class="opt-label">${labels[i]}</span><span>${o}</span>
    </button>`;
  }).join('');
  return `<div class="q-card">
    ${passageHtml}
    <div class="q-num">Q${idx + 1}</div>
    <div class="q-text">${q.q}</div>
    <div class="options">${opts}</div>
  </div>`;
}

function renderArrange(q, idx) {
  const saved = arrangeAnswers[idx] || [];
  const remaining = q.words.filter(w => !saved.includes(w));
  const savedChips = saved.map(w => `<span class="word-chip in-answer" onclick="removeWord(${idx},'${w}')">${w}</span>`).join('');
  const bankChips = remaining.map(w => `<span class="word-chip" onclick="addWord(${idx},'${w}')">${w}</span>`).join('');
  return `<div class="q-card">
    <div class="q-num">Q${idx + 1} — 문장 배열</div>
    <div class="korean-sentence">🇰🇷 ${q.korean}</div>
    <div class="arrange-hint">단어를 클릭해서 올바른 순서로 배열하세요:</div>
    <div class="answer-area active" id="answerArea_${idx}">${savedChips}</div>
    <div class="arrange-hint">단어 목록:</div>
    <div class="word-bank" id="wordBank_${idx}">${bankChips}</div>
    <div class="correct-answer" id="correctAnswer_${idx}"></div>
  </div>`;
}

function initArrange(idx, q) {}

function addWord(idx, word) {
  if (!arrangeAnswers[idx]) arrangeAnswers[idx] = [];
  arrangeAnswers[idx].push(word);
  renderQuestion(currentIdx);
}

function removeWord(idx, word) {
  if (!arrangeAnswers[idx]) return;
  const i = arrangeAnswers[idx].indexOf(word);
  if (i > -1) arrangeAnswers[idx].splice(i, 1);
  renderQuestion(currentIdx);
}

function selectMCQ(idx, optIdx) {
  userAnswers[idx] = optIdx;
  const labels = ['A', 'B', 'C', 'D'];
  for (let i = 0; i < 4; i++) {
    const b = document.getElementById(`opt_${idx}_${i}`);
    if (!b) continue;
    b.className = 'opt-btn' + (i === optIdx ? ' selected' : '');
  }
}

function goQuestion(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < allQuestions.length) renderQuestion(next);
}

// =====================================================
// 채점
// =====================================================
function submitTest() {
  clearInterval(timerInterval);
  const elapsed = Math.round((Date.now() - startTime) / 1000);
  const em = Math.floor(elapsed / 60), es = elapsed % 60;

  let correct = 0;
  const secScores = {};

  allQuestions.forEach((q, idx) => {
    if (!secScores[q.secId]) secScores[q.secId] = { c: 0, t: 0, name: q.secName };
    secScores[q.secId].t++;

    if (q.type === 'arrange') {
      const ans = (arrangeAnswers[idx] || []).join(' ').toLowerCase().replace(/[.,!?]/g, '');
      const correct_ans = q.answer.toLowerCase().replace(/[.,!?]/g, '');
      if (ans === correct_ans) { correct++; secScores[q.secId].c++; }
    } else {
      if (userAnswers[idx] === q.ans) { correct++; secScores[q.secId].c++; }
    }
  });

  const total = allQuestions.length;
  const score = Math.round(correct / total * 100);

  // 레벨 계산
  let ws = 0, mw = 0;
  allQuestions.forEach((q, idx) => {
    const lv = q.level || 3;
    mw += lv;
    const isCorrect = q.type === 'arrange'
      ? (arrangeAnswers[idx] || []).join(' ').toLowerCase().replace(/[.,!?]/g, '') === q.answer.toLowerCase().replace(/[.,!?]/g, '')
      : userAnswers[idx] === q.ans;
    if (isCorrect) ws += lv;
  });
  const r = ws / (mw || 1);
  const level = r >= 0.85 ? 5 : r >= 0.68 ? 4 : r >= 0.50 ? 3 : r >= 0.32 ? 2 : 1;

  const lvInfo = {
    1: { name: 'Beginner', emoji: '🌱', color: '#1a9e78' },
    2: { name: 'Elementary', emoji: '📗', color: '#5b4fcf' },
    3: { name: 'Intermediate', emoji: '📘', color: '#2979d4' },
    4: { name: 'Upper-Intermediate', emoji: '📙', color: '#d4900a' },
    5: { name: 'Advanced', emoji: '📕', color: '#d94040' }
  };
  const recBooks = {
    1: ["Dinosaurs Before Dark", "The Knight at Dawn", "Pirates Past Noon", "Mummies in the Morning"],
    2: ["Charlotte's Web", "Matilda", "The Wild Robot", "Sarah, Plain and Tall"],
    3: ["Bridge to Terabithia", "Frindle", "The Landry News", "Where the Red Fern Grows"],
    4: ["The Alchemist", "Shiloh", "To Kill a Mockingbird", "Gangsta Granny"],
    5: ["The Giver", "The Hunger Games", "Hatchet", "The Maze Runner"]
  };

  const lv = lvInfo[level];
  document.getElementById('testScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  document.getElementById('rEmoji').textContent = lv.emoji;
  document.getElementById('rLevel').textContent = 'Level ' + level;
  document.getElementById('rLevel').style.color = lv.color;
  document.getElementById('rName').textContent = lv.name;
  document.getElementById('rTotal').textContent = score + '점';
  document.getElementById('rCorrect').textContent = correct + '/' + total;
  document.getElementById('rAccuracy').textContent = score + '%';
  document.getElementById('rTime').textContent = `${em}분 ${es}초`;

  const secColors = { vocab: '#5b4fcf', grammar: '#d4900a', reading_short: '#1a9e78', reading_long: '#2979d4', arrange: '#d94040' };
  const secNames = { vocab: '어휘', grammar: '문법', reading_short: '짧은 독해', reading_long: '긴 독해', arrange: '문장 배열' };
  document.getElementById('sectionScores').innerHTML = Object.keys(secScores).map(k => {
    const p = Math.round(secScores[k].c / secScores[k].t * 100);
    const col = secColors[k] || '#5b4fcf';
    return `<div class="sec-score-card">
      <div class="sec-score-name">${secNames[k] || k}</div>
      <div class="sec-score-bar-bg"><div class="sec-score-bar" style="width:0%;background:${col}" data-pct="${p}"></div></div>
      <div class="sec-score-val" style="color:${col}">${secScores[k].c}/${secScores[k].t} (${p}%)</div>
    </div>`;
  }).join('');

  document.getElementById('recBooks').innerHTML = `
    <div class="rec-title">📚 추천 도서 — Level ${level}</div>
    <div class="book-chips">${recBooks[level].map(b => `<span class="book-chip">${b}</span>`).join('')}</div>`;

  setTimeout(() => {
    document.querySelectorAll('.sec-score-bar').forEach(el => { el.style.width = el.dataset.pct + '%'; });
  }, 300);
}
</script>
</body>
</html>
